function userSheet(){const u=S.user;$('#ov').innerHTML=`<div class="ov" data-a="closeov"><div class="sh"><div class="top"><h3>${u?'Olá, '+esc(u.name.split(' ')[0]):'Entrar rapidamente'}</h3><button class="bt s dk" data-a="close">Fechar</button></div>${u?`<p>${esc(u.name)} · ${esc(u.phone)}</p><button class="bt" style="width:100%" data-a="orders">MEUS PEDIDOS</button><p><button class="bt s o" style="color:#5b5e62;border-color:#d9d0ba" data-a="logout">Sair</button></p>`:`<label class="lb">Nome<input class="in" id="ln"></label><label class="lb">WhatsApp<input class="in" id="lp" type="tel"></label><div class="wn">Sem senha. A confirmação por código no WhatsApp/SMS exige um provedor de mensagens no servidor e não está ativa nesta demonstração.</div><button class="bt" style="width:100%" data-a="login">ENTRAR</button>`}</div></div>`}
const A={top(){close();location.hash='';if(!$('#mn'))home();scrollTo(0,0)},menu(){close();$('#salgados')?.scrollIntoView()},goa(){tab='a';menuR();$('#mm')?.classList.remove('open');$('#salgados')?.scrollIntoView()},gof(){tab='f';menuR();$('#mm')?.classList.remove('open');$('#salgados')?.scrollIntoView()},mmc(){$('#mm').classList.remove('open')},
mm(){$('#mm').classList.toggle('open')},tab(d){tab=d.t;menuR()},qm(d){Q[d.id]=Math.max(1,(Q[d.id]||1)-1);$('#q'+d.id).textContent=Q[d.id]},qp(d){Q[d.id]=(Q[d.id]||1)+1;$('#q'+d.id).textContent=Q[d.id]},
add(d){const p=S.prods.find(x=>x.id==+d.id),n=d.n?1:Q[d.id]||1,e=S.cart.find(i=>i.pid==p.id);e?e.qty+=n:S.cart.push({pid:p.id,name:p.name,price:p.price,qty:n});Q[d.id]=1;const q=$('#q'+d.id);if(q)q.textContent=1;save();stat();toast('Adicionado ao carrinho')},
cart(){V='cart';sheet()},close,closeov(d,e){if(e.target.classList.contains('ov'))close()},
cq(d){const i=S.cart[+d.x];i.qty+= +d.d;if(i.qty<1)S.cart.splice(+d.x,1);save();stat();sheet()},clear(){S.cart=[];save();stat();sheet()},go(){V='co';sheet()},
type(d){S.form.type=d.t;save();sheet()},pay(d){S.form.pay=d.p;save();sheet()},confirm:confirmOrder,orders:ordersSheet,user:userSheet,
login(){const n=$('#ln').value.trim(),p=$('#lp').value.trim();if(!n||p.replace(/\D/g,'').length<10)return toast('Informe nome e WhatsApp com DDD');S.user={name:n,phone:p};save();toast('Bem-vindo(a), '+n.split(' ')[0]);userSheet()},logout(){S.user=null;save();userSheet()},
repeat(d){const o=S.orders.find(x=>x.id==+d.id);o.items.forEach(i=>{const p=S.prods.find(x=>x.name==i.name),e=S.cart.find(c=>c.name==i.name);if(p&&p.on)e?e.qty+=i.qty:S.cart.push({pid:p.id,name:p.name,price:p.price,qty:i.qty})});save();stat();V='cart';sheet()}};
function close(){$('#ov').innerHTML=''}
document.addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(x){AD[x.dataset.x]?.(x.dataset);return}const a=e.target.closest('[data-a]');if(a&&A[a.dataset.a]){if(a.tagName=='A'&&!(a.getAttribute('href')||'').startsWith('#pedido'))e.preventDefault();A[a.dataset.a](a.dataset,e)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f){S.form[t.dataset.f]=t.value;save()}});
document.addEventListener('change',e=>{if(e.target.dataset.ad)AD.set(e.target)});
/* ADMIN — a senha NÃO está no código. Esta demo guarda só um hash neste navegador; segurança real exige backend. */
const en=new TextEncoder(),b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hp(pw,salt){const k=await crypto.subtle.importKey('raw',en.encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256))}
let au=false,at='dash';try{au=sessionStorage.getItem('dri_adm')=='1'}catch(e){}
function adm(){const el=$('#adm');el.hidden=false;
if(!S.adm||!au){el.innerHTML=`<div class="w" style="max-width:380px;padding-top:60px"><div class="logo" style="color:#8a6510">${esc(S.cfg.name)}</div><h2>${S.adm?'Painel Dri Salgados':'Primeiro acesso'}</h2><label class="lb">Usuário<input class="in" value="Adriana" readonly></label><label class="lb">${S.adm?'Senha':'Crie a senha (mínimo 6 caracteres)'}<input class="in" id="pw" type="password" autocomplete="${S.adm?'current-password':'new-password'}"></label>${S.adm?'':'<label class="lb">Repita a senha<input class="in" id="pw2" type="password"></label>'}<button class="bt dk" style="width:100%;margin-top:10px" data-x="${S.adm?'login':'setup'}">${S.adm?'ENTRAR':'CRIAR SENHA'}</button><div class="wn">Demonstração: o acesso é validado só neste navegador e não protege dados de verdade. Em produção, o login com senha em hash e a sessão ficam no servidor.</div><a class="bt s o" style="color:#5b5e62;border-color:#d9d0ba" href="#" data-a="top">Voltar ao site</a></div>`;return}
el.innerHTML=`<div class="at">${[['dash','Painel'],['ped','Pedidos'],['prod','Produtos'],['cfg','Loja']].map(t=>`<button class="${at==t[0]?'on':''}" data-x="tab" data-t="${t[0]}">${t[1]}</button>`).join('')}<button data-x="out">Sair</button></div><div class="w" style="padding-top:12px">${view()}</div>`}
const fld=(k,l,t='text')=>`<label class="lb">${l}<input class="in" type="${t}" data-ad="c" data-k="${k}" value="${esc(S.cfg[k])}"></label>`;
function view(){const O=S.orders,n=k=>O.filter(o=>o.st==k).length;
if(at=='dash')return`<h2>PAINEL DRI SALGADOS</h2><div class="kp">${['novo','conf','prep','pronto','ent','canc'].map(k=>`<div>${SN[k]}<b>${n(k)}</b></div>`).join('')}<div>Total de pedidos<b>${O.length}</b></div></div>`;
if(at=='ped'){const cols=ST.map(s=>s[0]);return`<h2>Pedidos</h2><div class="kb">${cols.map((s,i)=>`<div class="col"><h3>${SN[s]} (${n(s)})</h3>${O.filter(o=>o.st==s).reverse().map(o=>card2(o,i,cols)).join('')||'<small>Vazio</small>'}</div>`).join('')}</div><h3 style="margin:16px 0 8px">Cancelados (${n('canc')})</h3>${O.filter(o=>o.st=='canc').reverse().map(o=>`<div class="oc">#${o.id} · ${esc(o.name)} · ${R(o.total)} <button class="bt s" data-x="mv" data-id="${o.id}" data-s="novo">Reabrir</button></div>`).join('')}`}
if(at=='prod')return`<h2>Produtos</h2>${S.prods.map(p=>`<div class="ca"><b>${esc(p.name)}</b><div class="g2"><label class="lb">Nome<input class="in" data-ad="p" data-k="name" data-id="${p.id}" value="${esc(p.name)}"></label><label class="lb">Preço (vazio = a consultar)<input class="in" type="number" step=".1" data-ad="p" data-k="price" data-id="${p.id}" value="${p.price??''}"></label></div><label class="lb">Descrição<input class="in" data-ad="p" data-k="desc" data-id="${p.id}" value="${esc(p.desc)}"></label><div class="g2"><label class="lb">Categoria<select class="in" data-ad="p" data-k="cat" data-id="${p.id}"><option value="a" ${p.cat=='a'?'selected':''}>Assados</option><option value="f" ${p.cat=='f'?'selected':''}>Fritos</option></select></label><label class="lb">Foto<input class="in" type="file" accept="image/*" data-ad="up" data-id="${p.id}"></label></div><label class="lb"><input type="checkbox" data-ad="p" data-k="on" data-id="${p.id}" ${p.on?'checked':''}> Disponível</label><button class="bt s o" style="color:#5b5e62;border-color:#d9d0ba" data-x="del" data-id="${p.id}">Excluir</button></div>`).join('')}<h3>Novo produto</h3><div class="g2"><input class="in" id="np" placeholder="Nome"><select class="in" id="npc"><option value="a">Assados</option><option value="f">Fritos</option></select></div><button class="bt s dk" style="margin-top:8px" data-x="addp">Criar produto</button>`;
return`<h2>Loja</h2>${fld('name','Nome da loja')}${fld('wa','WhatsApp da loja (só números, com 55 e DDD)','tel')}${fld('ig','Instagram (sem @)')}${fld('addr','Endereço')}<div class="g2"><label class="lb">Cor de destaque<input class="in" type="color" data-ad="c" data-k="gold" value="${S.cfg.gold}"></label><label class="lb">Foto principal<input class="in" type="file" accept="image/*" data-ad="up" data-id="hero"></label></div>
<h3 style="margin-top:16px">Alterar senha</h3><label class="lb">Senha atual<input class="in" id="ps0" type="password"></label><label class="lb">Nova senha (mínimo 6)<input class="in" id="ps1" type="password"></label><button class="bt s dk" style="margin-top:8px" data-x="chpw">Alterar senha</button>`}
function card2(o,i,cols){return`<div class="oc"><b>#${o.id}</b> · ${new Date(o.t).toLocaleDateString('pt-BR')} ${new Date(o.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}<br>${esc(o.name)} · ${esc(o.phone)}<br>${o.items.map(x=>x.qty+'x '+esc(x.name)).join(', ')}<br><b>${R(o.total)}${o.np?' + itens a consultar':''}</b> · ${esc(o.pay)}<br>${o.type=='d'?'🛵 '+esc(o.addr):'🏪 Retirada'}${o.obs?'<br>Obs: '+esc(o.obs):''}<div class="r">${i?`<button class="bt s o" style="color:#5b5e62;border-color:#d9d0ba" data-x="mv" data-id="${o.id}" data-s="${cols[i-1]}">◀</button>`:''}${i<4?`<button class="bt s" data-x="mv" data-id="${o.id}" data-s="${cols[i+1]}">${SN[cols[i+1]]} ▶</button>`:''}<button class="bt s dk" data-x="mv" data-id="${o.id}" data-s="canc">Cancelar</button></div></div>`}
const AD={async setup(){const a=$('#pw').value,b=$('#pw2').value;if(a.length<6||a!=b)return toast('Senhas diferentes ou muito curtas');const s=crypto.getRandomValues(new Uint8Array(16));S.adm={salt:b64(s),hash:await hp(a,s)};au=true;try{sessionStorage.setItem('dri_adm','1')}catch(e){}save();adm()},
async login(){if(await hp($('#pw').value,ub(S.adm.salt))==S.adm.hash){au=true;try{sessionStorage.setItem('dri_adm','1')}catch(e){}adm()}else toast('Senha incorreta')},
out(){au=false;try{sessionStorage.removeItem('dri_adm')}catch(e){}location.hash='';$('#adm').hidden=true},tab(d){at=d.t;adm()},
mv(d){S.orders.find(o=>o.id==+d.id).st=d.s;save();adm()},del(d){if(confirm('Excluir produto?')){S.prods=S.prods.filter(p=>p.id!=d.id);save();adm()}},
addp(){const n=$('#np').value.trim();if(!n)return;S.prods.push({id:Date.now(),cat:$('#npc').value,name:n,desc:'',emo:'🥟',price:null,img:'',on:1});save();adm()},
async chpw(){const a=$('#ps0').value,b=$('#ps1').value;if(b.length<6)return toast('Nova senha muito curta');if(await hp(a,ub(S.adm.salt))!=S.adm.hash)return toast('Senha atual incorreta');const s=crypto.getRandomValues(new Uint8Array(16));S.adm={salt:b64(s),hash:await hp(b,s)};save();toast('Senha alterada');adm()},
set(t){const d=t.dataset,k=d.k;const v=t.type=='checkbox'?(t.checked?1:0):t.type=='number'?(t.value===''?null:+t.value):t.value;
if(d.ad=='p')S.prods.find(p=>p.id==d.id)[k]=v;else if(d.ad=='c'){S.cfg[k]=v;theme()}
else if(d.ad=='up'&&t.files[0]){up(t.files[0],u=>{if(d.id=='hero')S.cfg.hero=u;else S.prods.find(p=>p.id==d.id).img=u;save();adm()});return}save()}};
function up(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,900/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(f)}
const theme=()=>document.documentElement.style.setProperty('--g',S.cfg.gold);
function route(){const h=location.hash;$('#adm').hidden=true;if(h=='#admin'){if(!$('#mn'))home();adm()}else if(h.startsWith('#pedido/'))track(h.slice(8));else if(!$('#mn'))home()}
addEventListener('hashchange',route);
addEventListener('storage',e=>{if(e.key!=K||!e.newValue)return;try{const n=JSON.parse(e.newValue),nw=n.orders.length>S.orders.length;S=n;if(nw&&au){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.3)}catch(x){}toast('🔔 Novo pedido!')}
if(location.hash.startsWith('#pedido/'))track(location.hash.slice(8));else if(au&&location.hash=='#admin')adm()}catch(x){}});
theme();route();
</script></body></html>
